<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#020817" />

  <title>Mía Omnia</title>
  <meta name="description" content="Una inteligencia que conecta tu vida, tu trabajo y tu entorno." />

  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="shortcut icon" href="favicon.ico" />
  <link rel="apple-touch-icon" href="favicon.png" />

  <meta property="og:type" content="website" />
  <meta property="og:locale" content="es_MX" />
  <meta property="og:site_name" content="Mía Omnia" />
  <meta property="og:title" content="Mía Omnia" />
  <meta property="og:description" content="Una inteligencia que conecta tu vida, tu trabajo y tu entorno." />
  <meta property="og:url" content="https://miaomnia.com/" />
  <meta property="og:image" content="https://miaomnia.com/logo-mia-omnia.png" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Mía Omnia" />
  <meta name="twitter:description" content="Una inteligencia que conecta tu vida, tu trabajo y tu entorno." />
  <meta name="twitter:image" content="https://miaomnia.com/logo-mia-omnia.png" />

  <style>
    :root {
      --navy-950: #020817;
      --navy-900: #061225;
      --white: #f8fbff;
      --muted: #c4cedc;
      --gold: #c8a96a;
      --gold-soft: #eadcb7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
      background: var(--navy-950);
    }

    body {
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--white);
      overflow: hidden;
    }

    .page {
      position: relative;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 42px 24px;
      isolation: isolate;
      background:
        radial-gradient(circle at 50% 38%, rgba(38, 95, 164, 0.19), transparent 28%),
        radial-gradient(circle at 50% 43%, rgba(200, 169, 106, 0.075), transparent 43%),
        linear-gradient(150deg, #010511 0%, var(--navy-900) 50%, #020712 100%);
    }

    .page::before,
    .page::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: -2;
    }

    .page::before {
      background-image:
        linear-gradient(rgba(255,255,255,0.021) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.021) 1px, transparent 1px);
      background-size: 76px 76px;
      mask-image: radial-gradient(circle at center, black 0%, transparent 74%);
    }

    .page::after {
      background:
        linear-gradient(90deg, transparent, rgba(200,169,106,0.14), transparent) top 13% left 50% / 38% 1px no-repeat,
        linear-gradient(90deg, transparent, rgba(255,255,255,0.09), transparent) bottom 13% left 50% / 58% 1px no-repeat;
      opacity: .74;
    }

    .halo {
      position: absolute;
      width: min(650px, 84vw);
      aspect-ratio: 1;
      border-radius: 50%;
      border: 1px solid rgba(200,169,106,.10);
      box-shadow:
        0 0 160px rgba(31, 84, 150, .13),
        inset 0 0 110px rgba(255,255,255,.018);
      z-index: -1;
      animation: breathe 9s ease-in-out infinite;
    }

    .halo::before,
    .halo::after {
      content: "";
      position: absolute;
      border-radius: inherit;
      inset: 13%;
      border: 1px solid rgba(255,255,255,.052);
    }

    .halo::after {
      inset: 31%;
      border-color: rgba(200,169,106,.115);
    }

    .content {
      width: min(780px, 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transform: translateY(-1.5vh);
      animation: reveal 1.05s ease both;
    }

    .logo {
      width: min(500px, 86vw);
      height: auto;
      display: block;
      filter:
        drop-shadow(0 18px 44px rgba(0,0,0,.42))
        drop-shadow(0 0 24px rgba(200,169,106,.17));
      margin-bottom: 30px;
      animation: logoPulse 9s ease-in-out infinite;
    }

    .subtitle {
      max-width: 680px;
      font-size: clamp(1.08rem, 2.35vw, 1.40rem);
      line-height: 1.62;
      font-weight: 350;
      letter-spacing: .008em;
      color: var(--muted);
      text-wrap: balance;
      margin-bottom: 34px;
    }

    .coming {
      font-size: .75rem;
      letter-spacing: .31em;
      text-transform: uppercase;
      color: rgba(248,251,255,.70);
      margin-bottom: 27px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 184px;
      height: 52px;
      padding: 0 30px;
      border: 1px solid rgba(200,169,106,.66);
      border-radius: 999px;
      color: var(--white);
      text-decoration: none;
      font-size: .82rem;
      font-weight: 550;
      letter-spacing: .11em;
      text-transform: uppercase;
      background: rgba(255,255,255,.028);
      backdrop-filter: blur(12px);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.018);
      transition:
        transform 180ms ease,
        background 180ms ease,
        border-color 180ms ease,
        box-shadow 180ms ease;
    }

    .button:hover,
    .button:focus-visible {
      transform: translateY(-2px);
      background: rgba(200,169,106,.115);
      border-color: var(--gold-soft);
      box-shadow: 0 12px 34px rgba(0,0,0,.30);
      outline: none;
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(-1.5vh); }
    }

    @keyframes breathe {
      0%, 100% { transform: scale(.99); opacity: .72; }
      50% { transform: scale(1.018); opacity: 1; }
    }

    @keyframes logoPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.012); }
    }

    @media (max-width: 640px) {
      .page {
        padding: 30px 20px 52px;
      }

      .content {
        transform: translateY(-1vh);
      }

      .logo {
        width: min(410px, 91vw);
        margin-bottom: 24px;
      }

      .subtitle {
        line-height: 1.54;
        margin-bottom: 30px;
      }

      .halo {
        width: 94vw;
      }

      @keyframes reveal {
        from { opacity: 0; transform: translateY(9px); }
        to { opacity: 1; transform: translateY(-1vh); }
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .content,
      .logo,
      .halo {
        animation: none;
      }

      .button {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="halo" aria-hidden="true"></div>

    <section class="content" aria-label="Mía Omnia">
      <img
        class="logo"
        src="logo-mia-omnia.png"
        alt="Mía Omnia"
        width="900"
        height="594"
      />

      <p class="subtitle">
        Una inteligencia que conecta tu vida, tu trabajo y tu entorno.
      </p>

      <div class="coming">Próximamente</div>

      <a
        class="button"
        href="https://wa.me/524422376363"
        target="_blank"
        rel="noopener"
        aria-label="Conoce a Mía por WhatsApp"
      >
        Conoce a Mía
      </a>
    </section>
  </main>
</body>
</html>
